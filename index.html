<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ===== HEADER ===== -->
    <header>
        <h1>Student Expense Tracker</h1>
        <p>Manage your income and expenses easily</p>

        <button id="themeBtn">🌙 Dark Mode</button>
    </header>


    <main class="container">

        <!-- ===== DASHBOARD ===== -->
        <section class="dashboard">

            <div class="card">
                <h3>Total Income</h3>
                <p class="income">₹<span id="totalIncome">0</span></p>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <p class="expense">₹<span id="totalExpense">0</span></p>
            </div>

            <div class="card">
                <h3>Balance</h3>
                <p>₹<span id="balance">0</span></p>
            </div>

        </section>


        <!-- ===== ADD TRANSACTION ===== -->
        <section class="form-section">

            <h2>Add Transaction</h2>

            <form id="transactionForm">

                <div class="form-group">

                    <div>
                        <label for="type">Transaction Type</label>

                        <select id="type" required>
                            <option value="">Select Type</option>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>


                    <div>
                        <label for="amount">Amount</label>

                        <input
                            type="number"
                            id="amount"
                            placeholder="Enter amount"
                            min="1"
                            required
                        >
                    </div>


                    <div>
                        <label for="category">Category</label>

                        <select id="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Travel">Travel</option>
                            <option value="Education">Education</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>


                    <div>
                        <label for="date">Date</label>

                        <input
                            type="date"
                            id="date"
                            required
                        >
                    </div>

                </div>


                <div style="margin-top: 15px;">
                    <label for="description">Description</label>

                    <textarea
                        id="description"
                        rows="3"
                        placeholder="Enter transaction description"
                    ></textarea>
                </div>


                <button type="submit">
                    ➕ Add Transaction
                </button>

            </form>

        </section>


        <!-- ===== TRANSACTIONS ===== -->
        <section class="transactions">

            <h2>Transaction History</h2>


            <!-- Search & Filter -->

            <div class="filters">

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search transactions..."
                >


                <select id="filterType">

                    <option value="all">
                        All Transactions
                    </option>

                    <option value="income">
                        Income
                    </option>

                    <option value="expense">
                        Expense
                    </option>

                </select>


                <select id="filterCategory">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Education">Education</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>

                </select>

            </div>


            <!-- Transaction List -->

            <div
                id="transactionList"
                class="transaction-list"
            >

                <!-- JavaScript will add transactions here -->

                <p id="emptyMessage">
                    No transactions added yet.
                </p>

            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
